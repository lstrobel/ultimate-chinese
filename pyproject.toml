[project]
name = "ultimate-chinese"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brain-brew>=0.3.11",
    "pandas>=3.0.6",
    "py-pinyin-split>=6.0.0",
    "pypinyin>=0.55.0",
    "airium>=0.3.2",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = ["mypy>=2.4.0", "pandas-stubs>=3.0.5.260914", "ruff>=0.16.10"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = ["E501"]
